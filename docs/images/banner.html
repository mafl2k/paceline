<!doctype html>
<!-- Source of docs/images/banner.png, the wide Paceline banner for the README (1280 x 400), in the
     style of docs/images/logo.html (same fonts and render command, with --window-size=1280,400). -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head><body>
<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="3.5"/>
  </filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.30  0 0 0 0.06 0"/></filter>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="6" height="6" fill="#4a7fe0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#2c5bc0" stroke-width="2.2"/>
  </pattern>
  <!-- one rider from above, facing up; box 60 x 130 -->
  <symbol id="r" viewBox="0 0 60 110" overflow="visible">
    <g stroke="#2a2a2a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="30" y1="1" x2="30" y2="22" stroke-width="3.4"/>
      <line x1="30" y1="86" x2="30" y2="108" stroke-width="3.4"/>
      <path d="M22 22 L38 22"/>
      <path d="M14 50 Q12 34 24 23 M46 50 Q48 34 36 23" stroke-width="5" stroke="#1f2f55"/>
      <ellipse cx="20" cy="76" rx="6.5" ry="11" fill="#1f2f55"/>
      <ellipse cx="40" cy="72" rx="6.5" ry="11" fill="#1f2f55"/>
      <path d="M8 46 Q30 34 52 46 Q54 66 44 82 Q30 88 16 82 Q6 66 8 46 Z" fill="url(#hatch)"/>
      <circle cx="30" cy="39" r="10.5" fill="#fff"/>
      <path d="M24 36 Q30 31 36 36" stroke-width="2"/>
    </g>
  </symbol>
</defs>
<rect width="1280" height="400" fill="#fbf7ea"/>
<rect width="1280" height="400" filter="url(#paper)"/>
<g stroke="#9db8e6" stroke-width="1.6"><line x1="0" y1="64" x2="1280" y2="64"/><line x1="0" y1="96" x2="1280" y2="96"/><line x1="0" y1="128" x2="1280" y2="128"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="192" x2="1280" y2="192"/><line x1="0" y1="224" x2="1280" y2="224"/><line x1="0" y1="256" x2="1280" y2="256"/><line x1="0" y1="288" x2="1280" y2="288"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="352" x2="1280" y2="352"/><line x1="0" y1="384" x2="1280" y2="384"/></g>
<line x1="66" y1="0" x2="66" y2="400" stroke="#e58a8a" stroke-width="2"/>
<g filter="url(#wob)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <text x="96" y="122" font-family="Noteworthy" font-weight="700" font-size="104" fill="#26324f" stroke="none">Paceline</text>
  <path d="M94 138 Q260 130 470 136" stroke="#26324f" stroke-width="4.5"/>
  <text x="104" y="190" font-family="Bradley Hand" font-weight="700" font-size="30" fill="#5a5a5a" stroke="#5a5a5a" stroke-width="0.5" transform="rotate(-2 300 180)">TTT rotation helper for Sauce for Zwift</text>
  <!-- road, riding to the right -->
  <path d="M96 236 Q360 228 640 238" stroke="#555" stroke-width="3"/>
  <path d="M96 366 Q360 374 640 362" stroke="#555" stroke-width="3"/>
<use href="#r" x="164" y="239.5" width="64" height="117" transform="rotate(90 196 298)"/>
<use href="#r" x="274" y="239.5" width="64" height="117" transform="rotate(90 306 298)"/>
<use href="#r" x="384" y="239.5" width="64" height="117" transform="rotate(90 416 298)"/>
<use href="#r" x="494" y="239.5" width="64" height="117" transform="rotate(90 526 298)"/>
  <!-- rotation arrow: the leader swings off and drifts to the back -->
  <path d="M578 266 Q612 300 580 338 Q380 352 170 340" stroke="#f07a1a" stroke-width="9"/>
  <path d="M184 326 L166 340 L186 354" stroke="#f07a1a" stroke-width="9"/>
  <!-- the plan, reworked by hand -->
  <g font-family="Bradley Hand" font-weight="700" fill="#26324f" stroke="#26324f" stroke-width="0.8">
    <g transform="rotate(-6 790 60)"><text x="720" y="62" font-size="30">plan</text><text x="790" y="62" font-size="30" class="x">v2</text><text x="836" y="56" font-size="32" fill="#e0661a" stroke="#e0661a">v3</text></g>
    <text x="700" y="128" font-size="46" transform="rotate(-4 800 116)">45s@4.1</text>
    <path d="M906 104 l9 11 l18 -27" stroke="#2f8a3e" stroke-width="4.5"/>
    <text x="772" y="196" font-size="28" transform="rotate(-12 830 190)">40s@4.2</text>
    <text x="706" y="250" font-size="36" class="x" transform="rotate(4 790 240)">30s@4.4</text>
    <text x="868" y="254" font-size="38" fill="#e0661a" stroke="#e0661a" transform="rotate(12 878 244)">?</text>
    <g transform="rotate(-3 1080 180)"><text x="986" y="186" font-size="30" class="x">60s</text><text x="1046" y="190" font-size="38">45s@3.9</text></g>
    <text x="1004" y="306" font-size="44" transform="rotate(7 1090 294)">15s@4.8</text>
    <text x="1196" y="352" font-size="36" fill="#e0661a" stroke="#e0661a" transform="rotate(10 1210 340)">!!</text>
    <text x="0" y="0" font-size="20" fill="#5a5a5a" stroke="#5a5a5a" stroke-width="0.4" transform="translate(44 330) rotate(-90)">TTT · Thu</text>
  </g>
  <ellipse cx="1096" cy="294" rx="98" ry="36" stroke="#f07a1a" stroke-width="4" transform="rotate(7 1096 294)"/>
  <path d="M800 210 Q792 222 798 232" stroke="#f07a1a" stroke-width="3"/>
</g>
</svg><script>
for (const t of document.querySelectorAll('text.x')) {
  const b = t.getBBox(), y = b.y + b.height * 0.55, n = Math.max(3, Math.round(b.width / 14));
  let d = `M${b.x - 4} ${y}`;
  for (let i = 1; i <= n; i++) d += ` L${b.x - 4 + i * (b.width + 8) / n} ${y + (i % 2 ? -5 : 5)}`;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#26324f');
  p.setAttribute('stroke-width', '3'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
  t.parentNode.appendChild(p);
}
</script></body></html>
